<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f2e9">
    <style>
        :root {
            color-scheme: light;
            --bg: #f4f2e9;
            --panel: rgba(255, 255, 255, .66);
            --tile: rgba(255, 255, 255, .53);
            --text: #253228;
            --muted: #69766b;
            --green: #527b54;
            --border: rgba(79, 111, 79, .24);
            --active: rgba(207, 226, 198, .86);
            --field-bg: rgba(255, 255, 255, .76);
            --big-bg: rgba(218, 234, 208, .78);
            --fact-bg: rgba(232, 239, 227, .78);
            --footer-bg: rgba(244, 242, 233, .88);
            --tile-shadow: 0 7px 18px rgba(49, 72, 48, .10), inset 0 1px 0 rgba(255, 255, 255, .8);
            --panel-shadow: 0 12px 32px rgba(49, 72, 48, .08), inset 0 1px 0 rgba(255, 255, 255, .72);
            --toggle-bg: rgba(255, 255, 255, .75);
            --toggle-shadow: 0 8px 24px rgba(38, 61, 39, .18), inset 0 1px 0 rgba(255, 255, 255, .9);
        }

        html[data-theme="dark"] {
            color-scheme: dark;
            --bg: #111713;
            --panel: rgba(30, 41, 33, .72);
            --tile: rgba(43, 57, 46, .61);
            --text: #edf2e9;
            --muted: #aab8aa;
            --green: #b6d2aa;
            --border: rgba(170, 198, 163, .22);
            --active: rgba(69, 95, 69, .9);
            --field-bg: rgba(28, 39, 31, .82);
            --big-bg: rgba(54, 76, 56, .76);
            --fact-bg: rgba(18, 27, 21, .72);
            --footer-bg: rgba(17, 23, 19, .9);
            --tile-shadow: 0 7px 20px rgba(0, 0, 0, .17), inset 0 1px 0 rgba(255, 255, 255, .045);
            --panel-shadow: 0 12px 32px rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255, 255, 255, .045);
            --toggle-bg: rgba(35, 48, 38, .84);
            --toggle-shadow: 0 8px 25px rgba(0, 0, 0, .32), inset 0 1px 0 rgba(255, 255, 255, .08);
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Tahoma, Arial, sans-serif;
            transition: background-color .35s ease, color .35s ease;
            padding: 20px 16px 75px;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin: 15px auto 25px
        }

        .kicker {
            color: var(--green);
            font-size: 11px;
            letter-spacing: 3px
        }

        h1 {
            font-size: clamp(25px, 4vw, 38px);
            margin: 12px 0;
            color: var(--green)
        }

        header p {
            color: var(--muted);
            font-size: 13px;
            line-height: 2
        }

        .search {
            display: block;
            width: min(100%, 460px);
            margin: 22px auto;
            padding: 13px 15px;
            background: var(--field-bg);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--tile-shadow);
            backdrop-filter: blur(16px) saturate(135%);
            -webkit-backdrop-filter: blur(16px) saturate(135%);
            transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
            border-radius: 12px;
            font: inherit;
            outline: none;
        }

        .search:focus {
            border-color: var(--green)
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 18px auto
        }

        .legend-filter {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            font: inherit;
            font-size: 11px;
            padding: 9px 13px;
            border-radius: 30px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            box-shadow: var(--tile-shadow);
            backdrop-filter: blur(14px) saturate(130%);
            -webkit-backdrop-filter: blur(14px) saturate(130%);
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transform: scale(1);
            transition: transform .28s cubic-bezier(.2, .8, .2, 1),
                background-color .25s ease, color .25s ease,
                border-color .25s ease, box-shadow .25s ease;
        }

        .legend-filter:hover {
            border-color: var(--green);
            box-shadow: var(--toggle-shadow);
        }

        .legend-filter:active,
        .legend-filter.is-pressing {
            transform: scale(1.07, .97);
        }

        .legend-filter.is-selected {
            background: var(--active);
            border-color: var(--green);
            box-shadow: var(--toggle-shadow);
        }

        .legend-filter:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 3px;
        }

        .filter-hint {
            min-height: 16px;
            margin: -7px auto 8px;
            color: var(--muted);
            text-align: center;
            font-size: 11px;
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-left: 5px
        }

        .met .dot {
            background: #a8c5a0
        }

        .non .dot {
            background: #8cc9c1
        }

        .gas .dot {
            background: #e7c889
        }

        .other .dot {
            background: #c4a7df
        }

        .scroll {
            position: relative;
            width: 100%;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            padding: 8px 2px 15px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-x: contain;
            touch-action: pan-x pan-y;
            direction: ltr;
        }

        #table {
            direction: rtl;
            display: grid;
            grid-template-columns: repeat(18, minmax(49px, 1fr));
            gap: 5px;
            min-width: 950px
        }

        #lanth,
        #actin {
            display: grid;
            grid-template-columns: repeat(15, minmax(49px, 1fr));
            gap: 5px;
            min-width: 810px
        }

        .series-title {
            color: var(--muted);
            font-size: 12px;
            margin: 14px 0 0
        }

        .el {
            min-width: 0;
            min-height: 68px;
            padding: 5px 2px;
            border: 1px solid #405244;
            background: var(--tile);
            color: var(--text);
            border-radius: 8px;
            border-color: var(--border);
            cursor: pointer;
            font-family: inherit;
            box-shadow: var(--tile-shadow);
            background-image: linear-gradient(145deg, rgba(255, 255, 255, .055), transparent 68%);
            transition: background-color .14s ease, border-color .14s ease, transform .14s ease;
        }

        .el:hover,
        .el.active {
            background: var(--active);
            border-color: var(--green);
            box-shadow: 0 10px 24px rgba(64, 95, 62, .17), inset 0 1px 0 rgba(255, 255, 255, .24);
            transform: translateY(-2px)
        }

        .el .n {
            display: block;
            text-align: right;
            font-size: 9px;
            color: var(--muted)
        }

        .el b {
            display: block;
            font-size: 19px;
            margin: 5px 0
        }

        .el small {
            display: block;
            font-size: 9px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .el.met {
            border-color: #6b946b
        }

        .el.non {
            border-color: #4f9990
        }

        .el.gas {
            border-color: #bba166
        }

        .el.other {
            border-color: #9376ac
        }

        .el.hide {
            opacity: .14;
            filter: grayscale(.25);
        }

        .el.category-hidden {
            display: none !important;
        }

        .info {
            width: 100%;
            max-width: 900px;
            margin: 25px auto;
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--panel-shadow);
            backdrop-filter: blur(20px) saturate(140%);
            -webkit-backdrop-filter: blur(20px) saturate(140%);
            transition: background-color .35s ease, color .35s ease, border-color .35s ease, box-shadow .35s ease;
        }

        .info-head {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap
        }

        .big {
            width: 95px;
            height: 95px;
            flex-shrink: 0;
            border: 1px solid var(--green);
            border-radius: 16px;
            display: grid;
            place-content: center;
            text-align: center;
            background: var(--big-bg);
            box-shadow: var(--tile-shadow);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: background-color .35s ease, border-color .35s ease, box-shadow .35s ease;
        }

        .big b {
            font-size: 38px
        }

        .big small {
            font-size: 11px;
            color: var(--muted)
        }

        .info h2 {
            margin: 0 0 6px;
            font-size: 23px
        }

        .info p {
            color: var(--muted);
            font-size: 12px;
            line-height: 1.9;
            margin: 5px 0
        }

        .facts {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 9px
        }

        .fact {
            padding: 12px;
            background: var(--fact-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 0;
            box-shadow: var(--tile-shadow);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: background-color .35s ease, border-color .35s ease, box-shadow .35s ease;
        }

        .fact small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 8px
        }

        .fact b {
            font-size: 13px;
            overflow-wrap: anywhere
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 13px 18px;
            background: var(--footer-bg);
            border-top: 1px solid var(--border);
            backdrop-filter: blur(18px) saturate(135%);
            -webkit-backdrop-filter: blur(18px) saturate(135%);
            transition: background-color .35s ease, border-color .35s ease;
            z-index: 5;
            text-align: left;
        }

        .credit {
            direction: ltr;
            display: inline-block;
            text-decoration: none;
            color: var(--green);
            font-size: 12px;
        }

        .heart {
            display: inline-block;
            color: #ff7777;
            animation: heartbeat .85s infinite
        }

        @keyframes heartbeat {

            0%,
            100% {
                transform: scale(1)
            }

            15% {
                transform: scale(1.35)
            }

            30% {
                transform: scale(1)
            }

            45% {
                transform: scale(1.2)
            }
        }

        .theme-toggle {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            display: grid;
            place-items: center;
            width: 54px;
            height: 54px;
            padding: 0;
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text);
            background: var(--toggle-bg);
            box-shadow: var(--toggle-shadow);
            backdrop-filter: blur(18px) saturate(145%);
            -webkit-backdrop-filter: blur(18px) saturate(145%);
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            transform: scale(1);
            transition: transform .28s cubic-bezier(.2, .8, .2, 1),
                background-color .35s ease, color .35s ease,
                border-color .35s ease, box-shadow .35s ease;
        }

        .theme-toggle:hover {
            box-shadow: 0 10px 29px rgba(45, 70, 44, .2), inset 0 1px 0 rgba(255, 255, 255, .42);
        }

        html[data-theme="dark"] .theme-toggle:hover {
            box-shadow: 0 10px 29px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .08);
        }

        .theme-toggle:active,
        .theme-toggle.is-pressing {
            transform: scale(1.16, 1.09);
        }

        .theme-toggle:focus-visible {
            outline: 2px solid var(--green);
            outline-offset: 4px;
        }

        .theme-toggle svg {
            width: 23px;
            height: 23px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: transform .35s cubic-bezier(.2, .8, .2, 1), opacity .2s ease;
        }

        .theme-toggle .moon-icon {
            display: none;
        }

        .theme-toggle.is-dark .sun-icon {
            display: none;
        }

        .theme-toggle.is-dark .moon-icon {
            display: block;
        }

        .theme-toggle.is-dark .moon-icon {
            transform: rotate(-12deg);
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                transition-duration: .01ms !important;
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }

        @media(max-width:600px) {
            body {
                padding: 12px 10px 72px
            }

            header {
                margin: 12px 0 20px
            }

            h1 {
                font-size: 26px
            }

            .info {
                padding: 14px;
                border-radius: 14px
            }

            .big {
                width: 78px;
                height: 78px
            }

            .big b {
                font-size: 31px
            }

            .facts {
                grid-template-columns: repeat(2, minmax(0, 1fr))
            }

            footer {
                padding: 12px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            .heart {
                animation-duration: 4s
            }

            html {
                scroll-behavior: auto
            }
        }
    </style>
</head>

        const elements = raw.split("\n").map(line => {
            const [n, symbol, fa, en, mass, period, group, type] = line.split("|");
            return { n: +n, symbol, fa, en, mass, period: +period, group: +group, type };
        });
        const names = { met: "فلز", non: "نافلز", gas: "گاز نجیب", other: "شبه‌فلز" };
        const table = document.getElementById("table");
        const lanth = document.getElementById("lanth");
        const actin = document.getElementById("actin");
        const elementTiles = new Map();

        function makeTile(e) {
            const b = document.createElement("button");
            b.type = "button";
            b.className = `el ${e.type}`;
            b.dataset.id = e.n;
            b.innerHTML = `<span class="n">${e.n}</span><b>${e.symbol}</b><small>${e.fa}</small>`;
            b.title = `${e.fa} (${e.en})`;
            b.setAttribute("aria-label", `${e.fa}، عدد اتمی ${e.n}`);
            b.addEventListener("click", () => showElement(e));
            elementTiles.set(e.n, b);
            return b;
        }

        elements.forEach(e => {
            const b = makeTile(e);
            if (e.n >= 57 && e.n <= 71) lanth.appendChild(b);
            else if (e.n >= 89 && e.n <= 103) actin.appendChild(b);
            else {
                b.style.gridColumn = e.group;
                b.style.gridRow = e.period;
                table.appendChild(b);
            }
        });

        function faNumber(n) {
            return String(n).replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
        }

        function showElement(e) {
            document.querySelectorAll(".el").forEach(b => {
                b.classList.toggle("active", Number(b.dataset.id) === e.n);
            });
            const info = document.getElementById("info");
            info.innerHTML = `
 <div class="info-head">
  <div class="big"><small>عدد اتمی ${faNumber(e.n)}</small><b>${e.symbol}</b></div>
  <div><h2>${e.fa}</h2><p>${e.en}</p><p>دسته: ${names[e.type]}</p></div>
 </div>
 <div class="facts">
  <div class="fact"><small>عدد اتمی</small><b>${faNumber(e.n)}</b></div>
  <div class="fact"><small>جرم اتمی تقریبی</small><b>${e.mass}</b></div>
  <div class="fact"><small>دوره</small><b>${faNumber(e.period)}</b></div>
  <div class="fact"><small>گروه</small><b>${faNumber(e.group)}</b></div>
 </div>`;
        }

        const searchInput = document.getElementById("search");
        const filterButtons = Array.from(document.querySelectorAll(".legend-filter"));
        const filterHint = document.getElementById("filterHint");
        let activeTypeFilter = null;

        function applyFilters() {
            const q = searchInput.value.trim().toLowerCase();

            elements.forEach(e => {
                const tile = elementTiles.get(e.n);
                const textMatch = !q || String(e.n) === q ||
                    e.symbol.toLowerCase().includes(q) ||
                    e.fa.includes(q) || e.en.toLowerCase().includes(q);
                const categoryMatch = !activeTypeFilter || e.type === activeTypeFilter;

                tile.classList.toggle("hide", !textMatch);
                tile.classList.toggle("category-hidden", !categoryMatch);
            });

            filterButtons.forEach(button => {
                const selected = button.dataset.filter === activeTypeFilter;
                button.classList.toggle("is-selected", selected);
                button.setAttribute("aria-pressed", String(selected));
            });

            if (activeTypeFilter) {
                const selectedButton = filterButtons.find(button => button.dataset.filter === activeTypeFilter);
                filterHint.textContent = `نمایش دستهٔ ${selectedButton.textContent.trim()}؛ برای دیدن همهٔ عناصر دوباره روی همین عنوان بزن.`;
            } else {
                filterHint.textContent = "برای دیدن عناصر هر دسته، روی عنوانش بزن.";
            }
        }

        searchInput.addEventListener("input", applyFilters);

        filterButtons.forEach(button => {
            button.addEventListener("click", () => {
                const type = button.dataset.filter;
                activeTypeFilter = activeTypeFilter === type ? null : type;
                applyFilters();
            });

            button.addEventListener("pointerdown", () => button.classList.add("is-pressing"));
            ["pointerup", "pointercancel", "pointerleave", "touchend", "touchcancel"].forEach(eventName => {
                button.addEventListener(eventName, () => button.classList.remove("is-pressing"), { passive: true });
            });
            button.addEventListener("blur", () => button.classList.remove("is-pressing"));
        });

        const themeToggle = document.getElementById("themeToggle");
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');

        function setTheme(theme) {
            const isDark = theme === "dark";
            document.documentElement.dataset.theme = theme;
            themeToggle.classList.toggle("is-dark", isDark);
            themeToggle.setAttribute("aria-pressed", String(isDark));
            themeToggle.setAttribute("aria-label", isDark ? "تغییر به حالت روشن" : "تغییر به حالت تاریک");
            themeToggle.title = isDark ? "حالت روشن" : "حالت تاریک";
            themeColorMeta.setAttribute("content", isDark ? "#111713" : "#f4f2e9");
        }

        // Native click works for mouse, keyboard, and touch-generated clicks.
        themeToggle.addEventListener("click", function (event) {
            event.preventDefault();
            const current = document.documentElement.dataset.theme;
            setTheme(current === "dark" ? "light" : "dark");
        });

        // Press animation is decorative and never blocks the click action.
        themeToggle.addEventListener("pointerdown", () => themeToggle.classList.add("is-pressing"));
        const releaseThemeButton = () => themeToggle.classList.remove("is-pressing");
        ["pointerup", "pointercancel", "pointerleave", "touchend", "touchcancel"].forEach(eventName => {
            themeToggle.addEventListener(eventName, releaseThemeButton, { passive: true });
        });
        themeToggle.addEventListener("blur", releaseThemeButton);

        // Keep the table usable on narrow screens and select the first element reliably.
        applyFilters();
        showElement(elements.find(e => e.symbol === "Fe"));
    </script>
